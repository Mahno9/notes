# One grouped PR per ecosystem per month: every PR runs CI and Semgrep.
# tools/ink-renderer and crates/notes-ink-live are not listed: they depend on
# the GPL sdocx checkout under references/ (fetched by CI, not committed), so
# Dependabot cannot resolve them. Their lockfiles are bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      cargo-engine: { patterns: ['*'] }
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      cargo-shell: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      npm: { patterns: ['*'] }
